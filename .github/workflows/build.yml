name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: receipts
          POSTGRES_PASSWORD: receipts
          POSTGRES_DB: receipts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U receipts"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The frontend is built BEFORE the Python tests on purpose. Without web/dist the
      # app serves no SPA route at all, and the path-traversal tests would pass
      # vacuously - every request 404s because the route they probe does not exist.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://receipts:receipts@127.0.0.1:5432/receipts
        run: pytest -q -m "not live"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      # Here so the built image can actually be started before it is published.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: receipts
          POSTGRES_PASSWORD: receipts
          POSTGRES_DB: receipts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U receipts"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/receipt-tracker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
      # Build into the local daemon and prove the image works before publishing it.
      # A green test job says the source is fine; it says nothing about whether the
      # image was assembled correctly. Publishing an image that could not import its
      # own modules is exactly what happened once, and only a real run catches that.
      - name: Build stamp
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: receipt-tracker:smoke
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            BUILD_IMAGE=ghcr.io/${{ github.repository_owner }}/receipt-tracker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Every extraction engine must import inside the image
        run: |
          docker run --rm receipt-tracker:smoke python -c \
            "import app.main, app.extraction.factory, app.extraction.claude, \
             app.extraction.openrouter, app.extraction.local; print('modules import')"
          docker run --rm receipt-tracker:smoke python scripts/try_extract.py --help > /dev/null
          echo "the extraction CLI runs"

      # `--help` passing said nothing about whether the fixture the deploy guide tells
      # the user to point at is actually in the image - it was not, and the very first
      # command of the install failed. So check the real paths, read out of the docs,
      # rather than a hand-copied list that can drift away from them. The docs are
      # discovered too, so a new one is covered the day it is written - a list of
      # filenames here would be one more thing to forget to update.
      - name: Every script and fixture the docs reference must exist in the image
        run: |
          docs=$(git ls-files '*.md' ':!:web/**')
          echo "docs scanned: $docs"
          paths=$(grep -hoE '(scripts|tests)/[A-Za-z0-9_./-]+\.(py|sh|jpg|png)' \
            $docs | sort -u)
          echo "checking: $paths"
          test -n "$paths"
          for f in $paths; do
            docker run --rm receipt-tracker:smoke test -f "$f" \
              || { echo "MISSING IN IMAGE: $f"; exit 1; }
          done
          echo "every documented path is present"

      - name: The image must start and serve health
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgresql+asyncpg://receipts:receipts@127.0.0.1:5432/receipts \
            -e AUTH_DISABLED=true -e WORKER_ENABLED=false \
            receipt-tracker:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then found=yes; break; fi
            sleep 2
          done
          echo
          docker logs smoke
          docker rm -f smoke > /dev/null
          test "${found:-no}" = yes

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            BUILD_IMAGE=ghcr.io/${{ github.repository_owner }}/receipt-tracker:latest
          cache-from: type=gha
