# Leltár on TrueNAS SCALE.
#
# Apps -> Discover -> (three dots) -> Install via YAML, then paste this file.
# TrueNAS 25.10 and later require the top-level `services:` key, which is present below.
#
# This app is completely separate from the receipt scanner in the same repository: its own
# image, its own database, its own datasets and its own port. Installing, updating or
# removing one does nothing to the other.
#
# Before installing, create the datasets and edit the two marked lines:
#   /mnt/<pool>/apps/leltar/photos   - the photographs
#   /mnt/<pool>/apps/leltar/pgdata   - the PostgreSQL data directory
#
# Then set the environment values marked REQUIRED. See deploy/README.md.
#
# To update later: Apps -> leltar -> Stop, then Start. See `pull_policy` below.

name: leltar

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leltar
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD      # REQUIRED: any long random string
      POSTGRES_DB: leltar
      # Postgres refuses to initialise into a non-empty directory, and TrueNAS datasets
      # are not empty, so keep the data one level down.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/tank/apps/leltar/pgdata:/var/lib/postgresql/data   # EDIT: your pool name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leltar"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ghcr.io/cloudhunter77/leltar:latest
    # Updating is then: Apps -> leltar -> Stop, then Start. Every start fetches the
    # current :latest, so no shell and no YAML editing.
    #
    # TrueNAS has no "pull image" button for a custom YAML app - the three-dot menu's
    # "Update" is for catalog apps and does nothing here - so without this line the only
    # ways to get a new image are a shell or changing the tag below by hand.
    #
    # This package is public, so the pull is anonymous and needs no credential. That is
    # deliberate: the Apps subsystem keeps its own registry credentials and does NOT read
    # /root/.docker/config.json, so a `docker login` at the shell does not make an app
    # deploy able to pull. See deploy/README.md.
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "568:568"          # the TrueNAS `apps` user, so bind-mounted files stay writable
    environment:
      DATABASE_URL: postgresql+asyncpg://leltar:CHANGE_ME_DB_PASSWORD@db:5432/leltar  # REQUIRED: same password as above
      DATA_DIR: /data

      # --- identification --------------------------------------------------
      IDENTIFIER: claude                            # claude | ollama (ollama is a stub)
      ANTHROPIC_API_KEY: CHANGE_ME_API_KEY          # REQUIRED: a Console key, not a subscription
      IDENTIFIER_MODEL: claude-sonnet-5             # claude-haiku-4-5 costs about a fifth
      IDENTIFIER_EFFORT: low

      # --- auth -----------------------------------------------------------
      SECRET_KEY: CHANGE_ME_SECRET                  # REQUIRED: openssl rand -hex 32
      APP_PASSWORD_HASH: CHANGE_ME_PASSWORD_HASH    # REQUIRED: see deploy/README.md
      API_KEY: CHANGE_ME_API_KEY_FOR_SHORTCUT       # REQUIRED: openssl rand -hex 24

      # --- misc -----------------------------------------------------------
      MAX_IMAGE_EDGE: "1280"
      MAX_ITEMS_PER_PHOTO: "12"
      WORKER_ENABLED: "true"
    volumes:
      - /mnt/tank/apps/leltar/photos:/data                    # EDIT: your pool name
    ports:
      # 8089, because the receipt scanner already answers on 8088.
      - "8089:8000"
