[project]
name = "mazsola"
version = "0.1.0"
description = "Self-hosted receipt scanner and expense database for Hungarian receipts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "anthropic>=0.69",
    "pillow>=11.0",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; reformatting generated migrations only creates diff noise.
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency idiom puts calls in argument defaults on purpose.
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The tests import shared fixtures via `from tests.conftest import ...`. Running
# `python -m pytest` puts the working directory on sys.path and hides the need for this;
# a bare `pytest`, which is what CI runs, does not. Setting it here makes both work.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: hits the real Anthropic API; requires ANTHROPIC_API_KEY and real receipt images"]

[tool.setuptools.packages.find]
include = ["app*"]
