# Receipt Tracker on TrueNAS SCALE.
#
# Apps -> Discover -> (three dots) -> Install via YAML, then paste this file.
# TrueNAS 25.10 and later require the top-level `services:` key, which is present below.
#
# Before installing, create the datasets and edit the two marked lines:
#   /mnt/<pool>/apps/receipt-tracker/images   - the receipt photos
#   /mnt/<pool>/apps/receipt-tracker/pgdata   - the PostgreSQL data directory
#
# Then set the environment values marked REQUIRED. See deploy/README.md.

name: receipt-tracker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: receipts
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD      # REQUIRED: any long random string
      POSTGRES_DB: receipts
      # Postgres refuses to initialise into a non-empty directory, and TrueNAS datasets
      # are not empty, so keep the data one level down.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/tank/apps/receipt-tracker/pgdata:/var/lib/postgresql/data   # EDIT: your pool name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipts"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ghcr.io/cloudhunter77/receipt-tracker:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "568:568"          # the TrueNAS `apps` user, so bind-mounted files stay writable
    environment:
      DATABASE_URL: postgresql+asyncpg://receipts:CHANGE_ME_DB_PASSWORD@db:5432/receipts  # REQUIRED: same password as above
      DATA_DIR: /data

      # --- extraction -----------------------------------------------------
      ANTHROPIC_API_KEY: CHANGE_ME_API_KEY          # REQUIRED: console.anthropic.com
      EXTRACTOR: claude                             # claude | tesseract | ollama
      EXTRACTOR_MODEL: claude-opus-5                # claude-haiku-4-5 costs ~1/5 as much
      EXTRACTOR_EFFORT: medium

      # --- auth -----------------------------------------------------------
      SECRET_KEY: CHANGE_ME_SECRET                  # REQUIRED: openssl rand -hex 32
      APP_PASSWORD_HASH: CHANGE_ME_PASSWORD_HASH    # REQUIRED: see deploy/README.md
      API_KEY: CHANGE_ME_API_KEY_FOR_SHORTCUT       # REQUIRED: openssl rand -hex 24

      # --- misc -----------------------------------------------------------
      MAX_IMAGE_EDGE: "1600"
      WORKER_ENABLED: "true"
    volumes:
      - /mnt/tank/apps/receipt-tracker/images:/data          # EDIT: your pool name
    ports:
      - "8088:8000"
