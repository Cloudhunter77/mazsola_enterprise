# Receipt Tracker on TrueNAS SCALE.
#
# Apps -> Discover -> (three dots) -> Install via YAML, then paste this file.
# TrueNAS 25.10 and later require the top-level `services:` key, which is present below.
#
# Before installing, create the datasets and edit the two marked lines:
#   /mnt/<pool>/apps/receipt-tracker/images   - the receipt photos
#   /mnt/<pool>/apps/receipt-tracker/pgdata   - the PostgreSQL data directory
#
# Then set the environment values marked REQUIRED. See deploy/README.md.
#
# To update later: Apps -> receipt-tracker -> Stop, then Start. See `pull_policy` below.

name: receipt-tracker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: receipts
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD      # REQUIRED: any long random string
      POSTGRES_DB: receipts
      # Postgres refuses to initialise into a non-empty directory, and TrueNAS datasets
      # are not empty, so keep the data one level down.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/tank/apps/receipt-tracker/pgdata:/var/lib/postgresql/data   # EDIT: your pool name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipts"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: ghcr.io/cloudhunter77/receipt-tracker:latest
    # Updating is then: Apps -> receipt-tracker -> Stop, then Start. Every start fetches
    # the current :latest, so no shell and no YAML editing.
    #
    # TrueNAS has no "pull image" button for a custom YAML app - the three-dot menu's
    # "Update" is for catalog apps and does nothing here - so without this line the only
    # ways to get a new image are a shell or changing the tag below by hand.
    #
    # This package is public, so the pull is anonymous and needs no credential. That is
    # deliberate: the Apps subsystem keeps its own registry credentials and does NOT read
    # /root/.docker/config.json, so a `docker login` at the shell does not make an app
    # deploy able to pull - which made every update silently do nothing while every check
    # by hand passed. See deploy/README.md.
    #
    # The cost: a start while GHCR is unreachable fails instead of running the image
    # already on disk. `restart: unless-stopped` retries, so a reboot that comes up before
    # the network does should recover on its own, but if you would rather never risk it,
    # delete this line and pin an exact tag instead - CI publishes `sha-<short commit>`
    # alongside `latest`, and editing the tag here forces a pull of that exact build.
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "568:568"          # the TrueNAS `apps` user, so bind-mounted files stay writable
    environment:
      DATABASE_URL: postgresql+asyncpg://receipts:CHANGE_ME_DB_PASSWORD@db:5432/receipts  # REQUIRED: same password as above
      DATA_DIR: /data

      # --- extraction ------------------------------------------------------
      # Pick ONE engine and fill in only its key.
      EXTRACTOR: openrouter                         # openrouter | claude | tesseract | ollama

      # If EXTRACTOR=openrouter (uses OpenRouter credit; it reports the real cost per call)
      OPENROUTER_API_KEY: CHANGE_ME_OPENROUTER_KEY
      OPENROUTER_MODEL: anthropic/claude-sonnet-4.5 # must do vision AND structured outputs
      # OPENROUTER_SITE_URL: http://nas.local:8088  # optional, for the OpenRouter dashboard

      # If EXTRACTOR=claude (billed by Anthropic directly, not covered by a Claude subscription)
      # ANTHROPIC_API_KEY: CHANGE_ME_API_KEY
      # EXTRACTOR_MODEL: claude-opus-5
      # EXTRACTOR_EFFORT: medium

      # --- auth -----------------------------------------------------------
      SECRET_KEY: CHANGE_ME_SECRET                  # REQUIRED: openssl rand -hex 32
      APP_PASSWORD_HASH: CHANGE_ME_PASSWORD_HASH    # REQUIRED: see deploy/README.md
      API_KEY: CHANGE_ME_API_KEY_FOR_SHORTCUT       # REQUIRED: openssl rand -hex 24

      # --- misc -----------------------------------------------------------
      MAX_IMAGE_EDGE: "1600"
      WORKER_ENABLED: "true"
    volumes:
      - /mnt/tank/apps/receipt-tracker/images:/data          # EDIT: your pool name
    ports:
      - "8088:8000"
