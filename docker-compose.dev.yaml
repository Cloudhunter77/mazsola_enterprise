# Local development: builds from source and reloads on change.
# For the NAS use deploy/docker-compose.yaml, which pulls a prebuilt image instead.
name: receipt-tracker-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: receipts
      POSTGRES_PASSWORD: receipt-tracker
      POSTGRES_DB: receipts
    ports: ["5432:5432"]
    volumes: ["dev-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipts"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+asyncpg://receipts:receipts@db:5432/receipts
      DATA_DIR: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXTRACTOR: ${EXTRACTOR:-claude}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-claude-opus-5}
      SECRET_KEY: dev-secret-not-for-real-use
      AUTH_DISABLED: "true"
    ports: ["8000:8000"]
    volumes: ["dev-data:/data"]

volumes:
  dev-pgdata:
  dev-data:
